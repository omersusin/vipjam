name: VipJam CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dsp-host-tests:
    name: DSP host unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vipjam_dsp
    steps:
      - uses: actions/checkout@v4
      - name: Build and test fused DSP (host)
        run: make test

      - name: Preset v2→v3 migration smoke test
        working-directory: .
        run: python3 tools/convert_v2_to_v3.py --self-test

  apk-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-skeleton
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /opt/gradle-9.7.0
          key: ${{ runner.os }}-gradle-9.7.0-v1

      - name: Install Gradle 9.7.0
        run: |
          if [ ! -x /opt/gradle-9.7.0/bin/gradle ]; then
            sudo mkdir -p /opt
            curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.0-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-9.7.0/bin" >> "$GITHUB_PATH"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vipjam-debug-apk
          path: app-skeleton/app/build/outputs/apk/debug/*.apk
