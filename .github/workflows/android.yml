name: VipJam CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  dsp-host-tests:
    name: DSP host unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vipjam_dsp
    steps:
      - uses: actions/checkout@v5
      - name: Build and test fused DSP (host)
        run: make test

      - name: Preset v2→v3 migration smoke test
        working-directory: .
        run: python3 tools/convert_v2_to_v3.py --self-test

  native-lib:
    name: Native libvipjam.so
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure NDK with ndk-build
        run: |
          if [ ! -x "$ANDROID_NDK_HOME/ndk-build" ]; then
            sdkmanager "ndk;27.3.13750724"
            echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          fi
          "$ANDROID_NDK_HOME/ndk-build" --version

      - name: Build libvipjam.so (ndk-build)
        run: '"$ANDROID_NDK_HOME/ndk-build" -C vipjam_dsp/hal -j$(nproc)'

      - name: Verify HAL symbol exports
        run: |
          NM="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            f="vipjam_dsp/hal/libs/$abi/libvipjam.so"
            echo "== $abi $(stat -c%s "$f") bytes"
            "$NM" -D "$f" | grep -iE "AELI|VipJam" || true
            "$NM" -D "$f" | grep -qw "AELI" || exit 1
          done

      - name: Upload native libs
        uses: actions/upload-artifact@v5
        with:
          name: libvipjam-so
          path: vipjam_dsp/hal/libs/*/libvipjam.so

  module-zip:
    name: Magisk module zip
    runs-on: ubuntu-latest
    needs: [native-lib]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: libvipjam-so
          path: /tmp/vipjam-so

      - name: Stage driver libs and pack module
        run: |
          A64=$(find /tmp/vipjam-so -path "*arm64-v8a/libvipjam.so" | head -1)
          A32=$(find /tmp/vipjam-so -path "*armeabi-v7a/libvipjam.so" | head -1)
          [ -n "$A64" ] && [ -n "$A32" ] || { echo "missing abi .so"; exit 1; }
          mkdir -p vipjam-magisk/common/files
          cp "$A64" vipjam-magisk/common/files/libvipjam_arm64-v8a.so
          cp "$A32" vipjam-magisk/common/files/libvipjam_armeabi-v7a.so
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="git-$(git rev-parse --short HEAD)"
          fi
          sed -i "s/^version=.*/version=$VER/" vipjam-magisk/module.prop
          grep "^version=" vipjam-magisk/module.prop
          cd vipjam-magisk && zip -qr "../vipjam-magisk-$VER.zip" . -x "*.git*"
          ls -la "../vipjam-magisk-$VER.zip"
          echo "VER=$VER" >> "$GITHUB_ENV"

      - name: Upload module zip
        uses: actions/upload-artifact@v5
        with:
          name: vipjam-magisk
          path: vipjam-magisk-*.zip

  apk-debug:
    name: Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app-skeleton
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            /opt/gradle-9.7.0
          key: ${{ runner.os }}-gradle-9.7.0-v1

      - name: Install Gradle 9.7.0
        run: |
          if [ ! -x /opt/gradle-9.7.0/bin/gradle ]; then
            sudo mkdir -p /opt
            curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.0-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-9.7.0/bin" >> "$GITHUB_PATH"

      - name: Assemble debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: vipjam-debug-apk
          path: app-skeleton/app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release APK
    needs: [module-zip]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: app-skeleton
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Gradle 9.7.0
        run: |
          if [ ! -x /opt/gradle-9.7.0/bin/gradle ]; then
            sudo mkdir -p /opt
            curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-9.7.0-bin.zip
            sudo unzip -q /tmp/gradle.zip -d /opt
          fi
          echo "/opt/gradle-9.7.0/bin" >> "$GITHUB_PATH"

      - name: Prepare keystore
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > /tmp/vipjam.keystore
            echo "VIPJAM_KEYSTORE_PATH=/tmp/vipjam.keystore" >> "$GITHUB_ENV"
            echo "VIPJAM_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "VIPJAM_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "VIPJAM_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "TEST_SIGNED=false" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore /tmp/vipjam-ephemeral.keystore \
              -alias vipjam -keyalg RSA -keysize 2048 -validity 3650 \
              -storepass vipjam123 -keypass vipjam123 \
              -dname "CN=VipJam Ephemeral Test Key, OU=VipJam, O=VipJam"
            echo "VIPJAM_KEYSTORE_PATH=/tmp/vipjam-ephemeral.keystore" >> "$GITHUB_ENV"
            echo "VIPJAM_KEYSTORE_PASSWORD=vipjam123" >> "$GITHUB_ENV"
            echo "VIPJAM_KEY_ALIAS=vipjam" >> "$GITHUB_ENV"
            echo "VIPJAM_KEY_PASSWORD=vipjam123" >> "$GITHUB_ENV"
            echo "TEST_SIGNED=true" >> "$GITHUB_ENV"
            echo "TEST-SIGNED-NOT-FOR-PUBLISHING" > "$GITHUB_WORKSPACE/TEST-SIGNED.txt"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VIPJAM_VERSION_NAME=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_ENV"
          fi

      - name: Assemble signed release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: vipjam-release-apk
          path: |
            app-skeleton/app/build/outputs/apk/release/*.apk
            TEST-SIGNED.txt

      - name: Fetch module zip artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v5
        with:
          name: vipjam-magisk
          path: /tmp/vipjam-module

      - name: Attach APK and module zip to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(ls app-skeleton/app/build/outputs/apk/release/*.apk | head -1)
          zip=$(ls /tmp/vipjam-module/vipjam-magisk-*.zip | head -1)
          gh release upload "${GITHUB_REF#refs/tags/}" "$apk" "$zip" --clobber
