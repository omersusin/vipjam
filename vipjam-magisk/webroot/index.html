<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VipJam</title>
<link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/insets.css" />
<link rel="stylesheet" type="text/css" href="https://mui.kernelsu.org/internal/colors.css" />
<style>
  body { padding: 16px; background-color: var(--background); color: var(--onBackground); font-family: sans-serif; }
  .card { padding: 16px; background-color: var(--surfaceContainer); border-radius: 20px; margin-bottom: 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 8px 0; gap: 12px; }
  button { padding: 10px 18px; border-radius: 12px; border: none; background: var(--primary); color: var(--onPrimary); }
  button:disabled { opacity: 0.4; }
  button.ghost { background: transparent; color: var(--primary); border: 1px solid var(--primary); }
  select, input[type=text] { width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--outline); background: var(--surface); color: var(--onSurface); box-sizing: border-box; }
  input[type=range] { width: 100%; }
  .status { font-family: monospace; font-size: 12px; white-space: pre-wrap; }
  .note { font-size: 12px; opacity: 0.7; }
  .preset { display: flex; justify-content: space-between; align-items: center; margin: 6px 0; }
</style>
</head>
<body>
  <div class="card" id="nobeCtl" hidden>
    <span class="note">vipjam-ctl not found — controls disabled. Install the VipJam driver module first.</span>
  </div>
  <div class="card">
    <h2>VipJam Fused DSP</h2>
    <div class="row"><span>Master</span><button id="masterBtn">Toggle</button></div>
    <div class="row"><span>Profile</span></div>
    <select id="profile">
      <option value="headset">Headset</option>
      <option value="speaker">Speaker</option>
      <option value="bluetooth">Bluetooth</option>
    </select>
  </div>
  <div class="card">
    <div class="row"><span>Bass</span><span id="bassVal">50</span></div>
    <input type="range" id="bass" min="0" max="100" value="50" />
    <div class="row"><span>Clarity</span><span id="clarVal">50</span></div>
    <input type="range" id="clarity" min="0" max="100" value="50" />
    <div class="note">Slider changes are debounced 120ms before reaching the driver.</div>
  </div>
  <div class="card">
    <h3>Presets</h3>
    <div class="row"><input type="text" id="presetLink" placeholder="vipjam://preset link" /></div>
    <div class="row"><button id="presetBtn" class="ghost">Save link as preset</button></div>
    <div id="presetList"></div>
  </div>
  <div class="card">
    <h3>Driver status</h3>
    <div class="status" id="status">loading…</div>
    <div class="row"><button id="refreshBtn" class="ghost">Refresh</button><button id="diagBtn" class="ghost">Diagnostics</button></div>
  </div>
<script>
  const PRESET_DIR = "/data/local/tmp/vipjam/presets";
  const P_BASS_GAIN = 65577;
  const F_CLARITY = 131504;
  let hasCtl = true;
  let timers = {};

  async function sh(cmd) {
    const r = await ksu.exec(cmd);
    return (r.stdout || "") + (r.stderr || "");
  }
  function q(s) {
    return "'" + String(s).replace(/'/g, "'\\''") + "'";
  }
  function debounced(key, fn) {
    clearTimeout(timers[key]);
    timers[key] = setTimeout(fn, 120);
  }
  function decodeLink(link) {
    const p = "vipjam://preset?c=";
    if (link.indexOf(p) !== 0) return null;
    try {
      let b = link.slice(p.length).replace(/-/g, "+").replace(/_/g, "/");
      while (b.length % 4) b += "=";
      const bin = atob(b);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const text = new TextDecoder().decode(bytes);
      const obj = JSON.parse(text);
      if (obj && typeof obj === "object" && obj.schemaVersion === 3) return text;
      return null;
    } catch (e) {
      return null;
    }
  }
  function setEnabled(on) {
    for (const id of ["masterBtn", "profile", "bass", "clarity", "presetBtn", "diagBtn"]) {
      document.getElementById(id).disabled = !on;
    }
    document.getElementById("nobeCtl").hidden = on;
  }
  async function probe() {
    const out = await sh("command -v vipjam-ctl");
    hasCtl = out.trim() !== "";
    setEnabled(hasCtl);
  }
  async function refresh() {
    if (!hasCtl) {
      document.getElementById("status").textContent = "(vipjam-ctl not found)";
      return;
    }
    const out = await sh("vipjam-ctl status-json 2>&1");
    document.getElementById("status").textContent = out || "(empty)";
    listPresets();
  }
  async function diag() {
    if (!hasCtl) {
      document.getElementById("status").textContent = "(vipjam-ctl not found)";
      return;
    }
    const out = await sh("vipjam-ctl diag 2>&1");
    document.getElementById("status").textContent = out || "(empty)";
  }
  async function listPresets() {
    const out = await sh("vipjam-ctl list 2>/dev/null");
    const box = document.getElementById("presetList");
    box.innerHTML = "";
    for (const path of out.split("\n").map(s => s.trim()).filter(Boolean)) {
      const name = path.split("/").pop();
      const div = document.createElement("div");
      div.className = "preset";
      const label = document.createElement("span");
      label.textContent = name;
      const apply = document.createElement("button");
      apply.className = "ghost";
      apply.textContent = "Apply";
      apply.onclick = async () => {
        await sh("vipjam-ctl preset " + q(path));
        refresh();
      };
      div.appendChild(label);
      div.appendChild(apply);
      box.appendChild(div);
    }
  }
  function restoreSliders() {
    for (const [id, val] of [["bass", "bassVal"], ["clarity", "clarVal"]]) {
      const saved = localStorage.getItem("vipjam." + id);
      if (saved !== null) {
        document.getElementById(id).value = saved;
        document.getElementById(val).textContent = saved;
      }
    }
  }
  document.getElementById("refreshBtn").onclick = refresh;
  document.getElementById("diagBtn").onclick = diag;
  document.getElementById("masterBtn").onclick = async () => {
    await sh("vipjam-ctl toggle");
    refresh();
  };
  document.getElementById("profile").onchange = async (e) => {
    await sh("vipjam-ctl profile " + q(e.target.value));
    refresh();
  };
  for (const [id, paramId, val, mode] of [[ "bass", P_BASS_GAIN, "bassVal", 0 ], [ "clarity", F_CLARITY, "clarVal", 0 ]]) {
    document.getElementById(id).oninput = (e) => {
      document.getElementById(val).textContent = e.target.value;
      localStorage.setItem("vipjam." + id, e.target.value);
      const v = e.target.value;
      debounced(id, () => sh("vipjam-ctl param " + paramId + " " + v + " " + mode));
    };
  }
  document.getElementById("presetBtn").onclick = async () => {
    const link = document.getElementById("presetLink").value.trim();
    let text = null;
    if (link.startsWith("vipjam://preset?c=")) {
      text = decodeLink(link);
      if (text === null) return;
    } else {
      try {
        const obj = JSON.parse(link);
        if (!obj || typeof obj !== "object" || obj.schemaVersion !== 3) return;
        text = JSON.stringify(obj);
      } catch (e) {
        return;
      }
    }
    const name = "link-" + Date.now() + ".v3.json";
    await sh("mkdir -p " + q(PRESET_DIR) + " && printf '%s' " + q(text) + " > " + q(PRESET_DIR + "/" + name));
    document.getElementById("presetLink").value = "";
    listPresets();
  };
  restoreSliders();
  probe().then(refresh);
</script>
</body>
</html>
